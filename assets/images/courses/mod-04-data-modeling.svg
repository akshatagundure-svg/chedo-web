<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="factCube" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>
  <!-- Relationship Lines radiating from central Fact Table -->
  <line x1="40" y1="40" x2="40" y2="16" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="2 2"/>
  <line x1="40" y1="40" x2="63" y2="28" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="2 2"/>
  <line x1="40" y1="40" x2="63" y2="52" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="2 2"/>
  <line x1="40" y1="40" x2="40" y2="64" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="2 2"/>
  <line x1="40" y1="40" x2="17" y2="52" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="2 2"/>
  <line x1="40" y1="40" x2="17" y2="28" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="2 2"/>
  <!-- Central FACT Table -->
  <rect x="29" y="29" width="22" height="22" rx="4" fill="url(#factCube)" stroke="#4c1d95" stroke-width="1.5"/>
  <text x="40" y="43" text-anchor="middle" font-family="monospace" font-size="8" font-weight="900" fill="#ffffff">FACT</text>
  <!-- Dimension Table 1: Top -->
  <rect x="33" y="10" width="14" height="11" rx="2.5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
  <!-- Dimension Table 2: Top-Right -->
  <rect x="56" y="22" width="14" height="11" rx="2.5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
  <!-- Dimension Table 3: Bottom-Right -->
  <rect x="56" y="47" width="14" height="11" rx="2.5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
  <!-- Dimension Table 4: Bottom -->
  <rect x="33" y="59" width="14" height="11" rx="2.5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
  <!-- Dimension Table 5: Bottom-Left -->
  <rect x="10" y="47" width="14" height="11" rx="2.5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
  <!-- Dimension Table 6: Top-Left -->
  <rect x="10" y="22" width="14" height="11" rx="2.5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.2"/>
</svg>