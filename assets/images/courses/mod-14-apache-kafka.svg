<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <!-- Official Apache Kafka Geometric Connected Broker Circles -->
  <!-- Spokes -->
  <line x1="40" y1="20" x2="22" y2="52" stroke="#231f20" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="40" y1="20" x2="58" y2="52" stroke="#231f20" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="22" y1="52" x2="58" y2="52" stroke="#231f20" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Top Node (Producer) -->
  <circle cx="40" cy="20" r="9" fill="#ffffff" stroke="#231f20" stroke-width="4"/>
  <circle cx="40" cy="20" r="3.5" fill="#ef4444"/> <!-- Real-time telemetry pulse -->
  <!-- Left Node (Broker) -->
  <circle cx="22" cy="52" r="9" fill="#ffffff" stroke="#231f20" stroke-width="4"/>
  <circle cx="22" cy="52" r="3.5" fill="#231f20"/>
  <!-- Right Node (Consumer) -->
  <circle cx="58" cy="52" r="9" fill="#ffffff" stroke="#231f20" stroke-width="4"/>
  <circle cx="58" cy="52" r="3.5" fill="#231f20"/>
  <!-- High throughput streaming waves -->
  <path d="M40 38 Q48 34 50 42" stroke="#ef4444" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>