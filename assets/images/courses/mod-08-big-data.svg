<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="bdHadoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Cluster Network Links -->
  <line x1="40" y1="36" x2="20" y2="58" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 2"/>
  <line x1="40" y1="36" x2="40" y2="60" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 2"/>
  <line x1="40" y1="36" x2="60" y2="58" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 2"/>
  <!-- Central Big Data Server Node -->
  <rect x="25" y="14" width="30" height="22" rx="4" fill="url(#bdHadoop)" stroke="#b45309" stroke-width="1.5"/>
  <line x1="30" y1="21" x2="50" y2="21" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="26" x2="44" y2="26" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="48" cy="26" r="1.5" fill="#10b981"/>
  <!-- Distributed Worker Node 1 -->
  <circle cx="20" cy="58" r="9" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
  <text x="20" y="61.5" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#ffffff">W1</text>
  <!-- Distributed Worker Node 2 -->
  <circle cx="40" cy="60" r="9" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
  <text x="40" y="63.5" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#ffffff">W2</text>
  <!-- Distributed Worker Node 3 -->
  <circle cx="60" cy="58" r="9" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
  <text x="60" y="61.5" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#ffffff">W3</text>
</svg>