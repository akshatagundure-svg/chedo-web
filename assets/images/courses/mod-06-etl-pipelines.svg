<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" fill="none">
  <defs>
    <linearGradient id="etlFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Pipeline Pipe/Arrow -->
  <path d="M12 40 L68 40" stroke="url(#etlFlow)" stroke-width="5" stroke-linecap="round"/>
  <polygon points="68,40 60,35 60,45" fill="#10b981"/>
  <!-- Stage E: Extract Source Cylinder -->
  <rect x="8" y="26" width="16" height="28" rx="3" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <ellipse cx="16" cy="29" rx="6" ry="2" fill="#dbeafe"/>
  <text x="16" y="44" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#1d4ed8">E</text>
  <!-- Stage T: Transform Gear in Center -->
  <g transform="translate(40, 40)">
    <circle cx="0" cy="0" r="13" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <path d="M0 -15 L0 -11 M0 11 L0 15 M-15 0 L-11 0 M11 0 L15 0 M-11 -11 L-8 -8 M8 8 L11 11 M-11 11 L-8 8 M8 -8 L11 -11" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <text x="0" y="4" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#b45309">T</text>
  </g>
  <!-- Stage L: Load Warehouse Box -->
  <rect x="56" y="26" width="16" height="28" rx="3" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="64" y="44" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#047857">L</text>
</svg>